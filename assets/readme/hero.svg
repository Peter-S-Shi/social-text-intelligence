<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Social Text Intelligence: one social-text sentence becomes structured sentiment and emotion evidence</title>
  <desc id="hero-desc">A real synthetic example sentence enters Social Text Intelligence and comes out as structured intelligence: sentiment label negative with 68.7% confidence and a three-way score bar, dominant emotion neutral with a threshold explanation, three supporting emotion signals, and model provenance, all produced by local, offline inference.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1013"/>
      <stop offset="1" stop-color="#0a0c0f"/>
    </linearGradient>
    <clipPath id="barClip">
      <rect x="0" y="0" width="282" height="14" rx="7"/>
    </clipPath>
    <marker id="hero-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b339"/>
    </marker>
  </defs>

  <rect width="1200" height="440" fill="url(#bg)"/>

  <!-- column labels -->
  <text x="50" y="60" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#8a8f98">INPUT &#183; SYNTHETIC EXAMPLE</text>
  <text x="820" y="60" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="16" font-weight="600" letter-spacing="1.5" fill="#4fd1c5">STRUCTURED INTELLIGENCE</text>

  <!-- input card -->
  <g transform="translate(50 80)">
    <rect width="330" height="320" rx="18" fill="#12151a" stroke="#2a2f37" stroke-width="1.5"/>
    <text x="24" y="58" font-family="Georgia,serif" font-size="46" fill="#2f343c">&#8220;</text>
    <text x="24" y="76" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#f5f3ee">The new update finally</text>
    <text x="24" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#f5f3ee">fixed the login bug, but</text>
    <text x="24" y="136" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#f5f3ee">the app still crashes</text>
    <text x="24" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#f5f3ee">whenever I try to export</text>
    <text x="24" y="196" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="21" fill="#f5f3ee">a large file.</text>
    <line x1="24" y1="230" x2="306" y2="230" stroke="#2a2f37" stroke-width="1"/>
    <text x="24" y="256" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#7b828d">Synthetic example &#183; English</text>
    <text x="24" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" fill="#7b828d">Not real user data</text>
  </g>

  <!-- arrow: input -> product -->
  <text x="419" y="220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" letter-spacing="0.5" fill="#8a8f98" text-anchor="middle">locally analyzed</text>
  <line x1="382" y1="240" x2="450" y2="240" stroke="#e8b339" stroke-width="2.5" marker-end="url(#hero-arrow)"/>

  <!-- product block -->
  <g transform="translate(460 80)">
    <text x="140" y="130" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700" fill="#f5f3ee" text-anchor="middle">SOCIAL TEXT</text>
    <text x="140" y="168" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="34" font-weight="700" fill="#f5f3ee" text-anchor="middle">INTELLIGENCE</text>
    <text x="140" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#9aa1ab" text-anchor="middle">local sentiment +</text>
    <text x="140" y="220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#9aa1ab" text-anchor="middle">emotion inference</text>
    <rect x="42" y="240" width="196" height="32" rx="16" fill="none" stroke="#4fd1c5" stroke-width="1.5"/>
    <circle cx="66" cy="256" r="4" fill="#4fd1c5"/>
    <text x="145" y="261" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="0.5" fill="#4fd1c5" text-anchor="middle">OFFLINE &#183; ON-DEVICE</text>
  </g>

  <!-- arrow: product -> output -->
  <text x="779" y="220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" letter-spacing="0.5" fill="#8a8f98" text-anchor="middle">returns structured</text>
  <line x1="742" y1="240" x2="810" y2="240" stroke="#e8b339" stroke-width="2.5" marker-end="url(#hero-arrow)"/>

  <!-- output card -->
  <g transform="translate(820 80)">
    <rect width="330" height="320" rx="18" fill="#12151a" stroke="#2a2f37" stroke-width="1.5"/>

    <text x="24" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" letter-spacing="1" fill="#8a8f98">SENTIMENT</text>
    <text x="24" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="28" font-weight="700" fill="#f5f3ee">negative</text>
    <text x="306" y="63" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="600" fill="#e8b339" text-anchor="end">68.7%</text>

    <g transform="translate(24 84)">
      <rect width="282" height="14" rx="7" fill="#1e2227"/>
      <g clip-path="url(#barClip)">
        <rect x="0" y="0" width="194" height="14" fill="#e8b339"/>
        <rect x="194" y="0" width="83" height="14" fill="#565c66"/>
        <rect x="277" y="0" width="5" height="14" fill="#3a3f47"/>
      </g>
    </g>
    <text x="24" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa1ab">neg 69% &#183; neu 29% &#183; pos 1%</text>

    <line x1="24" y1="136" x2="306" y2="136" stroke="#2a2f37" stroke-width="1"/>

    <text x="24" y="160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="14" letter-spacing="1" fill="#8a8f98">DOMINANT EMOTION</text>
    <text x="24" y="192" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#f5f3ee">neutral</text>
    <text x="24" y="212" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13" fill="#7b828d">No signal cleared the 0.50 threshold</text>

    <g transform="translate(24 230)" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12.5" fill="#c7cbd1">
      <rect x="0" y="0" width="88" height="28" rx="14" fill="none" stroke="#2a2f37" stroke-width="1"/>
      <text x="44" y="18" text-anchor="middle">admiration .24</text>
      <rect x="97" y="0" width="82" height="28" rx="14" fill="none" stroke="#2a2f37" stroke-width="1"/>
      <text x="138" y="18" text-anchor="middle">sadness .07</text>
      <rect x="188" y="0" width="94" height="28" rx="14" fill="none" stroke="#2a2f37" stroke-width="1"/>
      <text x="235" y="18" text-anchor="middle">anger .06</text>
    </g>

    <line x1="24" y1="282" x2="306" y2="282" stroke="#2a2f37" stroke-width="1"/>
    <text x="24" y="302" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6b7280">cardiffnlp + SamLowe &#183; licensed</text>
    <text x="24" y="318" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#6b7280">local inference &#183; no text stored</text>
  </g>
</svg>
