<rect x="840" y="394" width="664" height="100" rx="16" fill="#B6C6C2" opacity="0.34"/>
<rect x="835" y="389" width="664" height="100" rx="16" fill="url(#cardbg)" stroke="#D5DFDB" stroke-width="1.6"/>
<rect x="852" y="407" width="53" height="45" rx="12" fill="#E4E9EF"/>
<text x="879" y="437" fill="#465E75" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="19" font-weight="700">03</text>
<text x="927" y="422" fill="#233840" font-family="Arial,Segoe UI,sans-serif" font-size="22" font-weight="700">EXPLORE</text>
<text x="927" y="450" fill="#637477" font-family="Arial,Segoe UI,sans-serif" font-size="16">Descriptive agreement, groups, and context</text>
<text x="927" y="470" fill="#85918F" font-family="Arial,Segoe UI,sans-serif" font-size="13">Agreement is not model accuracy</text>
