<text x="836" y="563" fill="#53696B" font-family="Arial,Segoe UI,sans-serif" font-size="14" letter-spacing="1.0">LOCAL TEXT · EXPLICIT MODEL SETUP · AUDITABLE HUMAN REVIEW</text>
