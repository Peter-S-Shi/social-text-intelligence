<circle cx="83" cy="84" r="1.25" fill="#E4AB82"/><circle cx="89" cy="84" r="1.25" fill="#E4AB82"/><circle cx="95" cy="84" r="1.25" fill="#E4AB82"/>
<text x="124" y="85" fill="#263B43" font-family="Arial,Segoe UI,sans-serif" font-size="17" font-weight="700" letter-spacing="1.65">SOCIAL TEXT INTELLIGENCE</text>
<text x="124" y="105" fill="#697778" font-family="Arial,Segoe UI,sans-serif" font-size="13" letter-spacing="1.4">WINDOWS DESKTOP · V2.0.0</text>
