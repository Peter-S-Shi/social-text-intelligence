<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title description">
<title id="title">Social Text Intelligence — Human judgment belongs beside the model</title>
<desc id="description">Conceptual workflow banner for the published V2 Windows application: analyze English feedback locally, preserve model outputs while humans review, and explore descriptive agreement and insights. This diagram is not a product screenshot or a model-quality result.</desc>
<defs>
 <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBFAF7"/><stop offset="0.55" stop-color="#F7F4EF"/><stop offset="1" stop-color="#EDF2F0"/></linearGradient>
 <linearGradient id="cardbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F7F6"/></linearGradient>
 <pattern id="microGrid" width="23" height="23" patternUnits="userSpaceOnUse"><path d="M23 0H0V23" fill="none" stroke="#ABB7B5" stroke-width="0.7" opacity="0.18"/></pattern>
 <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#617779"/></marker>
</defs>
