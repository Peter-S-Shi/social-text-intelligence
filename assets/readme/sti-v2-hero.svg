<text x="65" y="274" fill="#162B34" font-family="Georgia,serif" font-size="58" font-weight="bold">belongs beside</text>
<text x="65" y="344" fill="#B4513C" font-family="Georgia,serif" font-size="58" font-weight="bold">the model.</text>
<text x="67" y="407" fill="#3C5055" font-family="Arial,Segoe UI,sans-serif" font-size="22">Local-first analysis of English-language feedback</text>
<text x="67" y="439" fill="#3C5055" font-family="Arial,Segoe UI,sans-serif" font-size="22">with separate human review and descriptive insights.</text>
