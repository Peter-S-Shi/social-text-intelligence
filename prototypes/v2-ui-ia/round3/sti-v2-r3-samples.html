function simulate(text){
  const t=text.toLowerCase();
  const fr=/\b(merci|bonjour|très|beaucoup|nouvelle|version est|gracias|por favor|todo)\b/.test(t);
  const neg=(t.match(/crash|bug|broken|worst|slow|charged|refund|stuck|lost|hate|angry|terrible|never|again|disappoint|confus|scared|freez|annoy|slow|mess|wrong|cancel/g)||[]).length;
  const pos=(t.match(/love|great|thanks|thank|happy|brilliant|perfect|fixed|impress|gorgeous|fast|best|nice|helpful|lovely|works/g)||[]).length;
  let sent,conf;
  if(neg>pos){sent='negative';conf=Math.min(.95,.55+.12*(neg-pos)+.03*neg);}else if(pos>neg){sent='positive';conf=Math.min(.96,.55+.12*(pos-neg)+.03*pos);}else{sent='neutral';conf=.52;}
  let top='neutral',ts=.62;
  if(/charged|refund|angry|annoy|every single|again/.test(t)){top='anger';ts=.46+.08*neg;}
  else if(/scared|afraid|worried|terrif/.test(t)){top='fear';ts=.58;}
  else if(/thank/.test(t)){top='gratitude';ts=.7;}
  else if(/love|happy|perfect/.test(t)){top='joy';ts=.64;}
  else if(/brilliant|impress|gorgeous|great|fixed/.test(t)){top='admiration';ts=.28+.12*pos;}
  else if(/lol|haha|funny/.test(t)){top='amusement';ts=.6;}
  else if(/lost|sad|disappoint|gave up/.test(t)){top='sadness';ts=.47;}
  seed=text.length*31+7;
  const ai=mkAI(sent,+conf.toFixed(3),top,+Math.min(.92,ts).toFixed(3),[]);
  const tokens=Math.ceil(text.trim().split(/\s+/).length*1.35)+2;
  return {ai,fr,tokens};
}

  const withMock=fin.filter(t=>t.mock);const ag=f=>withMock.filter(t=>String(T.dec[t.id][f])===String(t.mock[f])).length;
  return banner+`<div class="bar"><h3>Summary & export</h3>${tabs}<span class="sp"></span><button class="btn" onclick="dlgExport('tri')">Export auditable CSV…</button></div><div class="pane" style="display:flex;flex-direction:column;gap:14px">
   <div class="grid" style="grid-template-columns:repeat(4,1fr)">${[[TICKETS.length,'eligible'],[fin.length,'finalized'],[TICKETS.filter(t=>status(t.id)==='draft').length,'draft'],[TICKETS.filter(t=>status(t.id)==='untriaged').length,'untriaged']].map(([n,l])=>`<div class="card" style="padding:14px 16px"><div class="big">${n}</div><div class="muted">${l}</div></div>`).join('')}</div>
   <div class="card" style="padding:16px 18px;display:grid;gap:8px"><div class="cap">Finalized distributions · sample ${fin.length}</div><div><b>Primary intent</b> ${dist('intent')}</div><div><b>Issue category</b> ${dist('cat')}</div><div><b>Urgency</b> ${dist('urg')}</div><div><b>Recommended queue</b> ${dist('queue')}</div></div>
   <div class="card" style="padding:16px 18px"><div class="cap">Human–mock comparison · descriptive, not accuracy</div><div class="row wrap" style="margin-top:8px;gap:16px">${[['intent','intent'],['cat','category'],['urg','urgency'],['queue','queue'],['esc','escalation']].map(([k,l])=>`<span><span class="mono">${ag(k)} / ${withMock.length}</span> <span class="muted">${l}</span></span>`).join('')}</div><div class="faint" style="font-size:11.5px;margin-top:6px">Mock-unavailable tickets are excluded from these denominators.</div></div></div>`;}
 const L=TICKETS.filter(t=>(!T.fStatus||status(t.id)===T.fStatus)&&(!T.fUrg||(T.dec[t.id]&&T.dec[t.id].urg===T.fUrg)));
 const t=TICKETS.find(x=>x.id===T.sel);const d=T.dec[t.id]||{intent:'',cat:'',urg:'',queue:'',esc:false,act:'',notes:'',status:'untriaged'};const fz=d.status==='finalized';
 const f=(k,list,lab,full)=>`<div class="field" ${full?'style="grid-column:1/-1"':''}><label>${lab}</label><select class="inp" ${fz?'disabled':''} onchange="triSet('${k}',this.value)">${opts(list,d[k],'Select')}</select></div>`;
 const cmp=fz&&t.mock?`<div class="card" style="padding:12px 14px;background:var(--machine-soft);border-color:var(--machine-line);font-size:12px"><div class="row"><span class="chip mac">Deterministic mock · revealed after finalize</span></div><div class="mono" style="margin-top:6px">${t.mock.intent} · ${t.mock.cat} · ${t.mock.urg} · ${t.mock.queue}</div><div style="margin-top:6px">${['intent','cat','urg','queue'].map(k=>d[k]===t.mock[k]?`<span class="chip ok">${k} same</span>`:`<span class="chip warn">${k} differs</span>`).join(' ')}</div></div>`:fz&&!t.mock?`<div class="note-box info">No mock exists for this ticket. Nothing has been fabricated or inferred.</div>`:'';
 return banner+`<div class="bar"><h3>Triage workspace</h3>${tabs}<span class="sp"></span><span class="mono faint">${TICKETS.length} tickets · ${fin.length} finalized · ${TICKETS.filter(x=>status(x.id)==='draft').length} draft</span></div>
 <div class="pane" style="display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:20px;align-items:start">
  <div style="display:flex;flex-direction:column;gap:10px"><div class="row wrap" style="gap:6px"><select class="inp" style="width:150px" onchange="S.tri.fStatus=this.value;render()">${opts(['untriaged','draft','finalized'],T.fStatus,'Status: all')}</select><select class="inp" style="width:150px" onchange="S.tri.fUrg=this.value;render()">${opts(OPT.urg,T.fUrg,'Urgency: all')}</select><span class="faint" style="font-size:11.5px">+ source, label, topic, community, intent, category, queue, escalation, mock, disagreement, warning, text search · sort</span></div>
   <div class="card" style="overflow:hidden"><table class="t"><thead><tr><th style="width:11%">ID</th><th style="width:15%">Source</th><th style="width:16%">Status</th><th style="width:13%">Urgency</th><th style="width:45%">Text</th></tr></thead><tbody>${L.map(x=>`<tr class="click ${x.id===T.sel?'sel':''}" onclick="S.tri.sel='${x.id}';render()"><td class="mono">${x.id}</td><td>${x.src}</td><td><span class="chip ${status(x.id)==='finalized'?'you':''}">${status(x.id)}</span></td><td>${T.dec[x.id]&&T.dec[x.id].urg||'—'}</td><td class="ell">${esc(x.text)}</td></tr>`).join('')||'<tr><td colspan="5" class="faint" style="text-align:center;padding:20px">No tickets match.</td></tr>'}</tbody></table></div></div>
  <div class="card" style="padding:16px 18px;display:flex;flex-direction:column;gap:8px"><div class="row"><span class="mono">${t.id}</span><span class="faint" style="font-size:11.5px">frozen guide v1</span><span class="sp"></span><span class="chip">${d.status}</span></div>
   <div style="font:400 20px/1.3 var(--serif)">“${esc(t.text)}”</div><div class="muted" style="font-size:12px">▸ Supporting context (sentiment, emotion, review, notes, metadata) — collapsed. Never decides triage.</div>
   <div class="grid" style="grid-template-columns:1fr 1fr;gap:7px">${f('intent',OPT.intent,'Primary intent')}${f('cat',OPT.cat,'Issue category')}${f('urg',OPT.urg,'Urgency')}${f('queue',OPT.queue,'Recommended queue')}<div class="field"><label>Escalation</label><div class="seg">${[['false','No'],['true','Yes']].map(([v,l])=>`<button class="${String(d.esc)===v?'on':''}" ${fz?'disabled':''} onclick="triSet('esc',${v})">${l}</button>`).join('')}</div></div><div></div>${f('act',OPT.act,'Primary next action',true)}</div>
   <div class="field"><label>Human notes</label><textarea class="inp" rows="2" ${fz?'disabled':''} oninput="triSet('notes',this.value,true)">${esc(d.notes)}</textarea></div>
   ${cmp}
   <div class="row" style="margin-top:4px">${fz?`<span class="faint" style="font-size:11.5px">Finalized. Revise explicitly to change it.</span><span class="sp"></span><button class="btn" onclick="S.tri.dec['${t.id}'].status='draft';toast('Revision started; the first decision stays frozen in the record.')">Revise explicitly</button>`:`<button class="btn" onclick="triSave('draft')">Save draft</button><span class="sp"></span><button class="btn pri" onclick="triSave('finalized')">Finalize</button>`}</div>
  </div></div>`;}
function triSet(k,v,quiet){const T=S.tri;const d=T.dec[T.sel]||(T.dec[T.sel]={intent:'',cat:'',urg:'',queue:'',esc:false,act:'',notes:'',status:'untriaged'});d[k]=v;if(!quiet)render();}
function triSave(st){const T=S.tri;const d=T.dec[T.sel]||(T.dec[T.sel]={intent:'',cat:'',urg:'',queue:'',esc:false,act:'',notes:'',status:'untriaged'});if(st==='finalized'&&!(d.intent&&d.cat&&d.urg&&d.queue&&d.act)){toast('Intent, category, urgency, queue and next action are required to finalize.');return;}d.status=st;toast(st==='draft'?'Draft saved.':'Finalized. The mock suggestion is now revealed for comparison.');}
/* ---------------- boot ---------------- */
const q=new URLSearchParams(location.search);
if(q.get('go')){S.models.state='ready';S.models.emo=1;const g=q.get('go');if(g==='import'){startImport();pickFile('support_inbox_october.csv');}else{S.route=g;}
 if(g==='direct')runDirect(); if(g==='compare')applyView(); if(g==='mod'&&q.get('step')==='train')startMod();}
else startDownload();
render();
</script>
</body>
