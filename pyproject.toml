[build-system]
requires = ["setuptools>=69,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "social-text-intelligence"
version = "0.10.0"
description = "A privacy-conscious, local-first social text intelligence workbench."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Social Text Intelligence contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
sentiment = [
  "torch>=2.13,<3",
  "transformers>=5.14,<6",
]
emotion = [
  "torch>=2.13,<3",
  "transformers>=5.14,<6",
]
# Local, offline language identification (BSD-3-Clause; the model ships inside the
# package, so nothing is downloaded). Without it the language check reports
# "unavailable" rather than guessing. See THIRD_PARTY_NOTICES.md.
language = [
  "py3langid>=0.4,<0.5",
]
web = [
  "flask>=3.1,<4",
  "py3langid>=0.4,<0.5",
]
# Native desktop shell. The app imports only the Qt Core, Gui, and Widgets modules
# (a test enforces this); PySide6-Essentials carries more than those, so the
# import boundary is tested; distribution audit tracks actual frozen files,
# including additional transitive Qt DLLs/plugins. Qt is LGPL-3.0:
# see THIRD_PARTY_NOTICES.md. The pre-distribution LGPL compliance gate is still open.
desktop = [
  "PySide6-Essentials>=6.11,<7",
  "py3langid>=0.4,<0.5",
]
dev = [
  "PySide6-Essentials>=6.11,<7",
  "py3langid>=0.4,<0.5",
  "flask>=3.1,<4",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[project.scripts]
sti = "social_text_intelligence.cli:main"
sti-web = "social_text_intelligence.interface.app:main"

[project.gui-scripts]
sti-desktop = "social_text_intelligence.desktop.qt.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
social_text_intelligence = [
  "interface/templates/*.html",
  "interface/static/*.css",
  "interface/static/*.js",
  "resources/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
follow_imports_for_stubs = true

# NumPy is not part of this project's type surface: no module here imports it. It
# reaches the checker only because pytest imports `ndarray` under TYPE_CHECKING, and
# NumPy 2.5+ (installed on Python 3.12/3.13 as a dependency of py3langid) ships stubs
# that use `type X = ...`, a syntax error under python_version = "3.11". We keep the
# lowest-supported language level and stop MyPy at the NumPy boundary instead of
# capping a transitive runtime dependency. `follow_imports_for_stubs` is required
# because MyPy otherwise follows .pyi files whatever `follow_imports` says; it only
# affects modules that opt out of following, i.e. NumPy. tests/test_type_surface.py
# fails if repo code ever starts importing NumPy, because this skip would then hide
# real errors.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
